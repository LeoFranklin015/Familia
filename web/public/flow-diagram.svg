<text x="85" y="55" fill="#d7f0e4" font-size="13" font-weight="600" text-anchor="middle">Parent</text>
<line x1="85" y1="70" x2="85" y2="622" stroke="#5fd3a3" stroke-width="1" opacity="0.18" />
<rect x="180" y="28" width="140" height="42" rx="12" fill="#0d3b2c" stroke="#5fd3a3" stroke-width="1.5" />
<text x="250" y="55" fill="#d7f0e4" font-size="13" font-weight="600" text-anchor="middle">Maya, age 9</text>
<line x1="250" y1="70" x2="250" y2="622" stroke="#5fd3a3" stroke-width="1" opacity="0.18" />
<rect x="349" y="28" width="182" height="42" rx="12" fill="#0d3b2c" stroke="#2f9e77" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="440" y="55" fill="#d7f0e4" font-size="13" font-weight="600" text-anchor="middle">UsdtPaymaster, ours</text>
<line x1="440" y1="70" x2="440" y2="622" stroke="#2f9e77" stroke-width="1" opacity="0.18" stroke-dasharray="5 6"/>
<rect x="562" y="28" width="196" height="42" rx="12" fill="#0d3b2c" stroke="#5fd3a3" stroke-width="1.5" />
<text x="660" y="55" fill="#d7f0e4" font-size="13" font-weight="600" text-anchor="middle">ScopedSpendManager</text>
<line x1="660" y1="70" x2="660" y2="622" stroke="#5fd3a3" stroke-width="1" opacity="0.18" />
<rect x="830" y="28" width="120" height="42" rx="12" fill="#0d3b2c" stroke="#5fd3a3" stroke-width="1.5" />
<text x="890" y="55" fill="#d7f0e4" font-size="13" font-weight="600" text-anchor="middle">Aave V3</text>
<line x1="890" y1="70" x2="890" y2="622" stroke="#5fd3a3" stroke-width="1" opacity="0.18" />
<rect x="1015" y="28" width="140" height="42" rx="12" fill="#0d3b2c" stroke="#5fd3a3" stroke-width="1.5" />
<text x="1085" y="55" fill="#d7f0e4" font-size="13" font-weight="600" text-anchor="middle">Corner shop</text>
<line x1="1085" y1="70" x2="1085" y2="622" stroke="#5fd3a3" stroke-width="1" opacity="0.18" />
<text x="20" y="102" fill="#5f7a6d" font-size="11" letter-spacing="1.5">SET UP ONCE</text>
<line x1="91" y1="132" x2="882" y2="132" stroke="#5f7a6d" stroke-width="1.8" marker-end="url(#hd)"/>
<circle cx="91" cy="132" r="11" fill="#07100c" stroke="#5f7a6d" stroke-width="1.6"/>
<text x="91" y="136" fill="#5f7a6d" font-size="12" font-weight="700" text-anchor="middle">1</text>
<text x="487.5" y="121" fill="#eaf3ee" font-size="13" text-anchor="middle">supply 500 USDT</text>
<text x="487.5" y="153" fill="#8ea79a" font-size="11.5" text-anchor="middle">the parent holds aUSDT, and it earns from here on</text>
<line x1="91" y1="194" x2="652" y2="194" stroke="#5f7a6d" stroke-width="1.8" marker-end="url(#hd)"/>
<circle cx="91" cy="194" r="11" fill="#07100c" stroke="#5f7a6d" stroke-width="1.6"/>
<text x="91" y="198" fill="#5f7a6d" font-size="12" font-weight="700" text-anchor="middle">2</text>
<text x="372.5" y="183" fill="#eaf3ee" font-size="13" text-anchor="middle">grant: 20 a week, 5 at a time</text>
<text x="372.5" y="215" fill="#8ea79a" font-size="11.5" text-anchor="middle">written on-chain before Maya has an account</text>
<line x1="20" y1="232" x2="1160" y2="232" stroke="#5fd3a3" stroke-width="1" opacity="0.14"/>
<text x="20" y="268" fill="#5f7a6d" font-size="11" letter-spacing="1.5">EVERY PAYMENT</text>
<line x1="256" y1="300" x2="652" y2="300" stroke="#5fd3a3" stroke-width="1.8" marker-end="url(#h)"/>
<circle cx="256" cy="300" r="11" fill="#07100c" stroke="#5fd3a3" stroke-width="1.6"/>
<text x="256" y="304" fill="#5fd3a3" font-size="12" font-weight="700" text-anchor="middle">3</text>
<text x="455.0" y="289" fill="#eaf3ee" font-size="13" text-anchor="middle">spend(8, shop)</text>
<text x="455.0" y="321" fill="#8ea79a" font-size="11.5" text-anchor="middle">signed by Maya’s own key</text>
<line x1="256" y1="362" x2="432" y2="362" stroke="#2f9e77" stroke-width="1.8" marker-end="url(#hf)" stroke-dasharray="6 5"/>
<circle cx="256" cy="362" r="11" fill="#07100c" stroke="#2f9e77" stroke-width="1.6"/>
<text x="256" y="366" fill="#2f9e77" font-size="12" font-weight="700" text-anchor="middle">4</text>
<text x="345.0" y="351" fill="#eaf3ee" font-size="13" text-anchor="middle">the fee for it</text>
<text x="548" y="356" fill="#2f9e77" font-size="12.5" font-weight="600">Maya pays nothing, her operation is sponsored</text>
<text x="548" y="376" fill="#8ea79a" font-size="11.5">a parent pays 0.0048 USDT for their own operations, and never ETH</text>
<path d="M666 416 h56 v34 h-58" fill="none" stroke="#5fd3a3" stroke-width="1.8" marker-end="url(#h)"/>
<circle cx="666" cy="416" r="11" fill="#07100c" stroke="#5fd3a3" stroke-width="1.6"/>
<text x="666" y="420" fill="#5fd3a3" font-size="12" font-weight="700" text-anchor="middle">5</text>
<text x="734" y="420" fill="#eaf3ee" font-size="13">cap, period, expiry, allowed address</text>
<text x="734" y="439" fill="#8ea79a" font-size="11.5">outside any one of them, the whole thing reverts</text>
<line x1="666" y1="502" x2="882" y2="502" stroke="#5fd3a3" stroke-width="1.8" marker-end="url(#h)"/>
<circle cx="666" cy="502" r="11" fill="#07100c" stroke="#5fd3a3" stroke-width="1.6"/>
<text x="666" y="506" fill="#5fd3a3" font-size="12" font-weight="700" text-anchor="middle">6</text>
<text x="775.0" y="491" fill="#eaf3ee" font-size="13" text-anchor="middle">pull 8 aUSDT</text>
<text x="775.0" y="523" fill="#8ea79a" font-size="11.5" text-anchor="middle">from the parent’s position</text>
<line x1="896" y1="564" x2="1077" y2="564" stroke="#5fd3a3" stroke-width="1.8" marker-end="url(#h)"/>
<circle cx="896" cy="564" r="11" fill="#07100c" stroke="#5fd3a3" stroke-width="1.6"/>
<text x="896" y="568" fill="#5fd3a3" font-size="12" font-weight="700" text-anchor="middle">7</text>
<text x="987.5" y="553" fill="#eaf3ee" font-size="13" text-anchor="middle">8 USDT</text>
<text x="987.5" y="585" fill="#8ea79a" font-size="11.5" text-anchor="middle">Aave redeems it</text>
<path d="M1136 286 h14 v294 h-14" fill="none" stroke="#5fd3a3" stroke-width="1.6" opacity="0.5"/>
<text x="1162" y="433" fill="#5fd3a3" font-size="11.5" font-weight="600" text-anchor="middle" transform="rotate(90 1162 433)">one transaction</text>
<text x="20" y="658" fill="#5f7a6d" font-size="12">The dashed track is the network fee. It is settled in USDT and never touches the money being spent, so nobody here holds a native token.</text>
